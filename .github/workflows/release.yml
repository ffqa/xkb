name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Cross-compile
        env:
          CGO_ENABLED: '0'
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          mkdir -p dist/release
          build() {
            local goos="$1" goarch="$2"
            local pkg="xkb-${RELEASE_TAG}-${goos}-${goarch}"
            local stage="dist/stage/${pkg}"
            mkdir -p "${stage}"
            GOOS="${goos}" GOARCH="${goarch}" go build -trimpath \
              -ldflags "-s -w -X github.com/xpier/xkb/internal/version.Version=${VERSION}" \
              -o "${stage}/xkb" ./cmd/xkb
            tar -C "dist/stage" -czf "dist/release/${pkg}.tar.gz" "${pkg}"
          }
          build darwin arm64
          build darwin amd64
          build linux amd64
          build linux arm64
          (cd dist/release && shasum -a 256 * > SHA256SUMS.txt)

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/release/*.tar.gz
            dist/release/SHA256SUMS.txt

      - name: Update Homebrew Tap
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.TAP_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          bash scripts/brew-publish.sh "${VERSION}"
